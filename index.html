<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/icons/icon.png" />
  <title>Paint Win 95'</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div class="desktop-shell">
    <aside class="desktop-icons" aria-label="Iconos del escritorio">
      <button id="desktop-paint" class="desktop-icon" type="button">
        <img src="/icons/icon.png" alt="" />
        <span>My Paint</span>
      </button>
      <button id="desktop-docs" class="desktop-icon" type="button">
        <img src="/icons/save.png" alt="" />
        <span>Mis Dibujos</span>
      </button>
      <button id="desktop-trash" class="desktop-icon" type="button">
        <img src="/icons/trash.png" alt="" />
        <span>Papelera</span>
      </button>
    </aside>

    <section id="paint-window" class="paint-window">
      <header id="title-bar" class="title-bar">
        <div class="title-bar-text">
          <img src="/icons/icon.png" alt="" />
          Untitled - Paint
        </div>
        <div class="title-bar-controls">
          <button id="win-min-btn" type="button" aria-label="Minimizar">_</button>
          <button id="win-max-btn" type="button" aria-label="Maximizar">&#9633;</button>
          <button id="win-close-btn" type="button" aria-label="Cerrar">X</button>
        </div>
      </header>

      <div id="container">
        <nav class="menu-row" aria-label="Menus">
          <button id="menu-file-btn" type="button">File</button>
          <button id="menu-edit-btn" type="button">Edit</button>
          <button id="menu-colours-btn" type="button">Colours</button>
          <button id="menu-help-btn" type="button">Help</button>
        </nav>

        <header class="menu-bar" aria-label="Acciones">
          <button id="new-btn" type="button">Nuevo</button>
          <button id="open-btn" type="button">Abrir</button>
          <button id="undo-btn" type="button">Deshacer</button>
          <button id="redo-btn" type="button">Rehacer</button>
          <button id="save-btn" type="button">Guardar</button>
          <input id="open-file-input" type="file" accept="image/*" hidden />
        </header>

        <aside class="toolbox" aria-label="Herramientas">
          <nav>
            <button id="select-btn" class="tool-btn glyph-tool-btn" type="button" title="Seleccion libre" aria-label="Seleccion libre">☆</button>
            <button id="select-rect-btn" class="tool-btn glyph-tool-btn" type="button" title="Seleccion rectangular" aria-label="Seleccion rectangular">▦</button>
            <button id="erase-btn" class="tool-btn" type="button" title="Borrar" aria-label="Borrar"></button>
            <button id="fill-btn" class="tool-btn" type="button" title="Rellenar" aria-label="Rellenar"></button>
            <button id="line-btn" class="tool-btn text-tool-btn" type="button" title="Linea" aria-label="Linea">/</button>
            <button id="picker-btn" class="tool-btn" type="button" title="Capturar color" aria-label="Capturar color"></button>
            <button id="draw-btn" class="tool-btn" type="button" title="Lapiz" aria-label="Lapiz"></button>
            <button id="brush-btn" class="tool-btn glyph-tool-btn" type="button" title="Pincel" aria-label="Pincel">B</button>
            <button id="text-btn" class="tool-btn text-tool-btn" type="button" title="Texto" aria-label="Texto">A</button>
            <button id="curve-btn" class="tool-btn glyph-tool-btn" type="button" title="Curva" aria-label="Curva">∿</button>
            <button id="rectangle-btn" class="tool-btn" type="button" title="Rectangulo" aria-label="Rectangulo"></button>
            <button id="ellipse-btn" class="tool-btn" type="button" title="Elipse" aria-label="Elipse"></button>
            <button id="polygon-btn" class="tool-btn glyph-tool-btn" type="button" title="Poligono" aria-label="Poligono">△</button>
            <button id="rounded-rect-btn" class="tool-btn glyph-tool-btn" type="button" title="Rectangulo redondeado" aria-label="Rectangulo redondeado">▢</button>
            <button id="clear-btn" class="tool-btn" type="button" title="Limpiar dibujo" aria-label="Limpiar dibujo"></button>
          </nav>
        </aside>

        <main id="canvas-wrap" class="canvas-wrap">
          <canvas id="canvas" aria-label="Lienzo de dibujo"></canvas>
          <canvas id="overlay-canvas" aria-hidden="true"></canvas>
        </main>

        <footer class="footer">
          <div class="colors-panel">
            <div class="color-wells" aria-label="Colores activo y secundario">
              <button id="primary-color-well" class="color-well primary" type="button" title="Color primario"></button>
              <button id="secondary-color-well" class="color-well secondary" type="button" title="Color secundario"></button>
            </div>
            <div class="color-inputs" aria-hidden="true">
              <input type="color" id="color-picker" value="#000000" />
              <input type="color" id="secondary-color-picker" value="#ffffff" />
            </div>
          </div>
          <div class="control-group">
            <label for="line-width">Grosor</label>
            <input id="line-width" type="range" min="1" max="40" step="1" value="2" />
            <span id="line-width-value">2</span>
          </div>
          <div class="control-group">
            <label for="zoom-select">Zoom</label>
            <select id="zoom-select">
              <option value="1">100%</option>
              <option value="2">200%</option>
              <option value="4">400%</option>
            </select>
          </div>
          <div class="control-group">
            <label for="fill-shapes">Rellenar formas</label>
            <input id="fill-shapes" type="checkbox" />
          </div>
          <div id="palette" class="palette" aria-label="Paleta clasica"></div>
          <div class="status-wrap">
            <span id="status-tool">Herramienta: Pincel</span>
            <span id="status-coords">X: 0, Y: 0</span>
          </div>
        </footer>
      </div>
    </section>

    <div id="start-menu" class="start-menu" hidden>
      <div class="start-menu-rail">
        <span>Windows 95</span>
      </div>
      <div class="start-menu-items">
        <button id="start-open-paint" type="button">Abrir Paint</button>
        <button id="start-new-drawing" type="button">Nuevo dibujo</button>
        <button id="start-open-image" type="button">Abrir imagen</button>
        <button id="start-clear-canvas" type="button">Limpiar lienzo</button>
      </div>
    </div>

    <footer class="taskbar">
      <button id="start-btn" class="start-btn" type="button" aria-expanded="false">Start</button>
      <button id="task-paint-btn" class="task-btn active" type="button">Paint</button>
      <div id="clock" class="clock">19:54</div>
    </footer>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
